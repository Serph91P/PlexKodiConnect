name: Add-on Validations

on:
  push:
    branches: [develop]

  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    name: Lint + Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint, advisory)
        run: ruff check . || true

      - name: Pytest
        run: pytest -v --cov=resources/lib --cov-report=term-missing

  package:
    name: Immutable Package + Evidence
    needs: [lint-and-test]
    uses: Serph91P/repository.serph91p/.github/workflows/reusable-addon-package.yml@7adff881ab5d0a7fc63f7474a78b2688e2e6eee4
    with:
      addon_id: plugin.video.plexkodiconnect
      runtime_entries_json: '["addon.xml", "changelog.txt", "context_extras.py", "context_menu.py", "default.py", "service.py", "fanart.jpg", "icon.png", "themoviedb.png", "resources/"]'
    permissions:
      contents: read
      id-token: write
